<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Literacy Workshops</title>

    <!-- Font Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet"> 
    <link href="https://fonts.googleapis.com/css2?family=Amoret+Sans&display=swap" rel="stylesheet"> 

    <style>
        @font-face {
            font-family: 'Amoret Sans', sans-serif;
            src: url('assets/font/amoret-sans.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans', sans-serif;
            color: #222;
        }
        .hero {
            display: flex;
            height: 700px;
            padding: 0 0%;
            margin: 30px; 
        }
        .hero-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .subtitle {
            font-size: 32px;
            margin-bottom: 0px;
            opacity: 50%;
        }
        .title {
            font-family: Amoret Sans, sans-serif!important;
            font-size: 80px;
            font-weight: 400;
            line-height: 90px;
            color: #274353!important;
            margin-bottom: 40px;
            margin-top: 24px;
        }
        .email-form {
            display: flex;
            margin-bottom: 40px;
            position: relative; 
            max-width: 500px; 
        }
        .email-input {
            width: 100%;
            padding: 25px;
            padding-right: 135px; 
            border: 1px solid rgba(34, 34, 34, 0.5); 
            border-radius: 50px; 
            font-size: 16px;
            background-color: transparent; 
            color: #222;
        }
        .email-input::placeholder {
            color: rgba(34, 34, 34, 0.5);
        }
        .join-button {
            position: absolute;
            right: 8px;
            top: 8px;
            bottom: 8px;
            width: 127px;
            border: none;
            border-radius: 28px;
            background-color: #274353;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .join-button:hover {
            background-color: #3CA8E6;
        }

        .description {
            max-width: 729px;
            font-weight: 700;
            font-size: 24px;
            color: #666666;
            line-height: normal;
        }
        .shape-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        
        @media only screen and (max-width: 767px) {
            .hero {
                flex-direction: column;
                height: auto;
                margin: 15px;
                padding: 20px 0;
            }

            .hero-content {
                text-align: center;
                order: 2;
            }

            .title {
                font-size: 36px;
                line-height: 40px;
                margin-bottom: 15px;
                margin-top: 20px;
            }

            .description {
                font-size: 16px;
                max-width: 100%;
                margin-bottom: 15px;
            }

            .svg-container {
                order: 1;
                width: 100%;
                display: flex;
                justify-content: center;
                margin-bottom: 20px;
            }

            .svg-container svg {
                width: 80%;
                height: auto;
                max-height: 400px;
            }
        }

@media only screen and (max-width: 480px) {
    .hero {
        margin: 10px;
    }

    .title {
        font-size: 30px;
        line-height: 34px;
    }

    .description {
        font-size: 14px;
    }

    .svg-container svg {
        width: 90%;
        max-height: 300px;
    }
}

    /* cards */ 
        @font-face {
            font-family: 'Amoret Sans';
            src: url('assets/font/amoret-sans.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans', sans-serif;
            color: #222;
        }

        .page-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            max-width: 1800px;
            margin: 120px auto 0;
            margin-bottom: 200px;
            padding: 1rem;
        }

        .yoga-card {
            width: 428px;
            height: 446px;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .yoga-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 700ms cubic-bezier(0.19, 1, 0.22, 1);
        }

        .yoga-card:after {
            content: '';
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(180deg, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.4));
            transition: opacity 1400ms cubic-bezier(0.19, 1, 0.22, 1);
            opacity: 0;
            backdrop-filter: blur(5px);
            z-index: 1;
        }

        .yoga-card-content {
            position: absolute;
            bottom: 24px;
            left: 16px;
            right: 0;
            padding: 1.5rem;
            transform: translateY(calc(100% - 4.5rem));
            z-index: 2;
            transition: transform 700ms cubic-bezier(0.19, 1, 0.22, 1);
        }

        .yoga-card:hover:after {
            opacity: 1;
        }

        .yoga-card:hover .yoga-card-content {
            transform: translateY(0);
        }

        .yoga-card:hover img {
            transform: translateY(-0.5%);
        }

        .yoga-card-title-container {
            background-color: #F5F5F5;
            border-radius: 50px;
            padding: 10px 20px;
            display: inline-block;
            margin-bottom: 10px;
            z-index: 3;
        }

        .yoga-card-title {
            color: #222222!important;
            font-family: 'Amoret Sans', sans-serif;
            font-size: 16px!important;
            font-weight: 400!important;
            margin: 0!important;
        }

        .yoga-card-copy {
            color: #E5E4E4;
            font-size: 16px;
            opacity: 0;
            transform: translateY(1rem);
            transition: opacity 700ms cubic-bezier(0.19, 1, 0.22, 1), transform 700ms cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 3;
        }

        .yoga-card-btn {
            font-family: 'Amoret Sans', sans-serif!important;
            font-size: 14px;
            background-color: #2A495A!important;
            color: white;
            border: none!important;
            padding: 10px 20px;
            border-radius: 15px!important;
            cursor: pointer;
            margin-top: 10px!important;
            opacity: 0;
            transform: translateY(1rem);
            transition: opacity 700ms cubic-bezier(0.19, 1, 0.22, 1), transform 700ms cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 3;
        }
        .yoga-card-btn:hover {
            background-color: #3CA8E6!important;
            color:#fff !important;
            }

        .yoga-card:hover .yoga-card-copy,
        .yoga-card:hover .yoga-card-btn {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
<body>
    <!-- Hero Section Starts -->

        <script>
            (function() {
                const cards = [
                    { title: 'financial literacy', 
                    copy: 'Learn budgeting, investing, and other financial skills. Feel more confident in managing your money and building wealth across generations.', 
                    button: '<a href="https://ascendtials.org/financial-literacy-24/" target="_blank" style="color:inherit; text-decoration:none;">View Events</a>', 
                    image: 'assets/img/Financial Literacy.jpg' },
                    
                    { title: 'Spiritual literacy', 
                    copy: 'Practice Kemetic Yoga with us. Connect breath and slow movement, guiding the body through poses inspired by the ancient illustrations of Egyptian gods and goddesses.', 
                    button: '<a href="https://ascendtials.org/spiritual-literacy-24/" target="_blank" style="color:inherit; text-decoration:none;">View Events</a>', 
                    image: 'assets/img/Spiritual literacy.jpg'  },
                    
                    { title: 'Cosmic literacy', 
                    copy: 'Deepen your knowledge of astronomy and astrology. Learn about the constellations, moon cycles, and astral phenomena.', 
                    button: '<a href="https://ascendtials.org/cosmic-literacy-24/" target="_blank" style="color:inherit; text-decoration:none;">View Events</a>', 
                    image: 'assets/img/Cosmic literacy.jpg' },
        
                    { title: 'Civic literacy', 
                    copy: 'Become an informed and active citizen. Attend a civic literacy workshop and learn about our history, politics, and rights.', 
                    button: '<a href="https://ascendtials.org/civic-literacy-24/" target="_blank" style="color:inherit; text-decoration:none;">View Events</a>', 
                    image: 'assets/img/Civic Literacy.png' },
        
                    { title: 'Environmental literacy',
                    copy: 'Connect with nature and give back to the environment. Get your hands dirty and clean up public spaces, learn to garden, and hike with us.', 
                    button: '<a href="https://ascendtials.org/environmental-literacy-24/" target="_blank" style="color:inherit; text-decoration:none;">View Events</a>', 
                    image: 'assets/img/Environmental literacy 2.jpg' },
                ];
        
                const pageContent = document.querySelector('.page-content');
        
                cards.forEach(card => {
                    const cardElement = document.createElement('div');
                    cardElement.className = 'yoga-card';
                    cardElement.innerHTML = `
                        <img src="${card.image}" alt="${card.title}">
                        <div class="yoga-card-content">
                            <div class="yoga-card-title-container">
                                <h2 class="yoga-card-title">${card.title}</h2>
                            </div>
                            <p class="yoga-card-copy">${card.copy}</p>
                            <button class="yoga-card-btn">${card.button}</button>
                        </div>
                    `;
                    pageContent.appendChild(cardElement);
                });
            })();
        </script>

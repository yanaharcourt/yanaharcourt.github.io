<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation SVG</title>
    <style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
    }

    /* Стили для секции */
    .donation-section {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 100px 0;
        overflow-x: hidden;
    }

    .center-wrapper {
        width: 100%;
        max-width: 1500px;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: auto;
    }

    /* Все фигуры */
    .figures-container {
        position: relative;
        width: 1326px;
        height: 650px;
        margin: 100px 30px 100px 30px;
    }

    /* Общие стили для фигур */
    .figure {
        position: absolute;
        display: inline-block;
    }

    /* Стили для SVG */
    svg {
        overflow: visible;
    }

    /* Первая фигура */
    .first-figure-container {
        top: 0;
        left: 0;
    }

    /* основная часть первой фигуры */
    .main-figure {
        transition: transform 0.3s ease;
        transform-origin: center;
    }

    .main-figure:hover {
        transform: scale(1.03);
    }

    /* нижняя часть фигуры */
    .bottom-rect {
        transition: transform 0.3s ease;
        transform-origin: center bottom;
    }

    .bottom-rect:hover {
        transform: scale(1.03);
    }

    /* прямоугольник с закругленными углами */
    .rect-figure {
        transition: transform 0.3s ease;
        transform-origin: center;
    }

    .rect-figure:hover {
        transform: scale(1.03);
    }

    /* Вторая фигура */
    .second-figure-container {
        top: 146px;
        left: 264px;
        transition: transform 0.3s ease;
    }

    .second-figure-container:hover {
        transform: scale(1.03);
    }

    /* Третья фигура */
    .third-figure-container {
        top: 255px;
        left: 528px;
        transition: transform 0.3s ease;
    }

    .third-figure-container:hover {
        transform: scale(1.03);
    }

    /* Четвертая фигура */
    .fourth-figure-container {
        top: 146px;
        left: 794px;
        transition: transform 0.3s ease;
    }

    .fourth-figure-container:hover {
        transform: scale(1.03);
    }

    /* Пятая фигура */
    .fifth-figure-container {
        top: 0;
        left: 1058px;
    }

    /* Стили для кругов-кнопок */
    .circle-button {
        cursor: pointer;
        transition: fill 0.3s ease;
    }

    .first-figure-container .circle-button:hover,
    .third-figure-container .circle-button:hover,
    .fifth-figure-container .circle-button:hover {
        fill: #3CA8E6;
    }

    /* Стили для стрелок внутри кругов */
    .arrow-path {
        transition: none;
    }
    </style>
</head>
<body>
    <section class="donation-section">
        <div class="center-wrapper">
            <div class="figures-container">
                <div class="figure first-figure-container">
                    <!-- Первая фигура -->
                    <div class="figure first-figure-container">
                        <svg width="250" height="530" viewBox="0 0 250 530" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Основная фигура с анимацией -->
                            <g class="main-figure">
                                <path d="M0 344V40C0 17.9086 17.9086 0 40 0H116.775C124.288 0 131.341 3.61569 135.727 9.71505C140.113 15.8144 147.167 19.4301 154.679 19.4301H209C231.091 19.4301 249 37.3387 249 59.43V344C249 366.091 231.091 384 209 384H40C17.9086 384 0 366.091 0 344Z" fill="#193E2F"/>
                                <!-- Прямоугольник с закругленными углами и анимацией -->
                                <rect class="rect-figure" x="9" y="299" width="230" height="75" rx="30" fill="#2B5043"/>
                                <!-- Интерактивный круг-кнопка -->
                                <a href="https://donate.stripe.com/5kAg0K1MBghGcSYcN1?locale=en&__embed_source=buy_btn_1O7QQfKPdzGaX2lnUTMK2gbq" target="_blank">
                                    <circle class="circle-button" cx="203" cy="336" r="20" fill="#D1EE7B"/>
                                    <!-- Стрелка внутри круга -->
                                    <path class="arrow-path" d="M196.6 342.401L209.4 329.601M209.4 329.601H199.8M209.4 329.601V339.201" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                                </a>
                            </g>
                            <!-- Нижний блок с закругленными углами -->
                            <g class="bottom-rect">
                                <rect y="394" width="250" height="136" rx="40" fill="#E6E6E6"/>
                                <!-- Сердце (иконка внизу слева) -->
                                <path d="M47.9733 433.947L34.6666 438.96C31.5999 440.107 29.0933 443.734 29.0933 446.987V466.8C29.0933 469.947 31.1733 474.08 33.7066 475.974L45.1733 484.534C48.9333 487.36 55.1199 487.36 58.8799 484.534L70.3466 475.974C72.8799 474.08 74.9599 469.947 74.9599 466.8V446.987C74.9599 443.707 72.4533 440.08 69.3866 438.934L56.0799 433.947C53.8133 433.12 50.1866 433.12 47.9733 433.947Z" stroke="#274353" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <!-- Галочка внутри сердца -->
                                <path d="M44.1333 459.654L48.4266 463.947L59.8933 452.48" stroke="#274353" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </g>
                        </svg>
                    </div>
                </div>
        

                <!-- Вторая фигура с заливкой изображением -->
                <div class="figure second-figure-container">
                    <svg width="263" height="530" viewBox="0 0 263 530" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <pattern id="imageFill" patternUnits="userSpaceOnUse" width="249" height="384">
                                <image href="https://ascendtials.org/wp-content/uploads/2024/10/a-boy.png" x="0" y="0" width="249" height="384" />
                            </pattern>
                        </defs>
                        
                        <!-- Вторая фигура -->
                        <path class="second-figure" d="M0 344V40C0 17.9086 17.9086 0 40 0H116.775C124.288 0 131.341 3.61569 135.727 9.71505C140.113 15.8144 147.167 19.4301 154.679 19.4301H209C231.091 19.4301 249 37.3387 249 59.43V344C249 366.091 231.091 384 209 384H40C17.9086 384 0 366.091 0 344Z" fill="url(#imageFill)" fill-opacity="1"/>
                    </svg>
                </div>

                <!-- Третья фигура -->
                <div class="figure third-figure-container">
                    <svg width="250" height="275" viewBox="0 0 250 275" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Основной прямоугольник с закругленными углами -->
                        <rect width="250" height="275" rx="40" fill="#D3DCDA"/>
                        <!-- Второй прямоугольник с закругленными углами -->
                        <rect x="10" y="190" width="230" height="75" rx="30" fill="#BBC1C0"/>
                        <!-- Интерактивный круг-кнопка -->
                        <a href="https://ascendtials.org/contact-us/" target="_blank">
                            <circle class="circle-button" cx="204" cy="227" r="20" fill="#274353"/>
                            <!-- Стрелка внутри круга -->
                            <path class="arrow-path" d="M197.6 233.401L210.4 220.601M210.4 220.601H200.8M210.4 220.601V230.201" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                        </a>
                    </svg>
                </div>

                <!-- Четвертая фигура -->
                <div class="figure fourth-figure-container">
                    <svg width="249" height="384" viewBox="0 0 249 384" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <pattern id="imageFill2" patternUnits="userSpaceOnUse" width="249" height="384">
                                <image href="https://ascendtials.org/wp-content/uploads/2024/10/education-kids.png" x="0" y="0" width="249" height="384" />
                            </pattern>
                        </defs>
                        <path d="M249 344V40C249 17.9086 231.091 0 209 0H132.225C124.712 0 117.659 3.61569 113.273 9.71505C108.887 15.8144 101.833 19.4301 94.3205 19.4301H40C17.9086 19.4301 0 37.3387 0 59.43V344C0 366.091 17.9086 384 40 384H209C231.091 384 249 366.091 249 344Z" fill="url(#imageFill2)"/>
                    </svg>
                </div>
                <!-- Пятая фигура -->
                <div class="figure fifth-figure-container">
                    <svg width="250" height="530" viewBox="0 0 250 530" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g clip-path="url(#clip0_887_1871)" class="main-figure">
                            <path d="M250 344V40C250 17.9086 232.091 0 210 0H133.225C125.712 0 118.659 3.61569 114.273 9.71505C109.887 15.8144 102.833 19.4301 95.3205 19.4301H41C18.9086 19.4301 1 37.3387 1 59.43V344C1 366.091 18.9086 384 41 384H210C232.091 384 250 366.091 250 344Z" fill="#D1EE7B"/>
                            <path d="M116.288 51.6592L293.504 62.8703L132.352 134.292L-44.8631 123.081L116.288 51.6592Z" fill="#AACA6B"/>
                            <path d="M133.278 123.365L373.774 107.25L143.305 174.942L-97.1908 191.056L133.278 123.365Z" fill="#AACA6B"/>
                            <path d="M137.301 172.184L377.818 156.177L147.37 223.977L-93.1469 239.984L137.301 172.184Z" fill="#AACA6B"/>
                            <path d="M141.325 221.003L380.836 199.823L149.382 262.449L-90.1292 283.629L141.325 221.003Z" fill="#AACA6B"/>
                            <rect x="10" y="299" width="230" height="75" rx="30" fill="#AFC969" class="rect-figure"/>
                            <!-- Интерактивный круг-кнопка -->
                            <a href="https://buy.stripe.com/7sI29U62R5D23iocNd" target="_blank">
                                <circle class="circle-button" cx="204" cy="336" r="20" fill="#274353"/>
                                <!-- Стрелка внутри круга -->
                                <path class="arrow-path" d="M197.6 342.401L210.4 329.601M210.4 329.601H200.8M210.4 329.601V339.201" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                            </a>
                        </g>
                        <g class="bottom-rect">
                            <rect y="394" width="250" height="136" rx="40" fill="#D9D9D9"/>
                            <path d="M47.6535 488.493C46.7468 488.813 45.2535 488.813 44.3468 488.493C36.6135 485.853 19.3335 474.84 19.3335 456.173C19.3335 447.933 25.9735 441.267 34.1602 441.267C39.0135 441.267 43.3068 443.613 46.0002 447.24C48.6935 443.613 53.0135 441.267 57.8402 441.267C66.0268 441.267 72.6668 447.933 72.6668 456.173C72.6668 474.84 55.3868 485.853 47.6535 488.493Z" stroke="#274353" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </g>
                        <defs>
                            <clipPath id="clip0_887_1871">
                                <rect width="249" height="384" fill="white" transform="translate(1)"/>
                            </clipPath>
                        </defs>
                    </svg>
                </div>
            </div>
        </div>
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SVG Shape Example</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: #f0f0f0;
            }
            .svg-container {
                width: 610px;
                height: 610px;
            }
        </style>
    </head>
    <body>
        <div class="svg-container">
            <svg width="610" height="610" viewBox="0 0 610 610" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <pattern id="imgPattern" patternUnits="userSpaceOnUse" width="610" height="610">
                        <image href="assets/img/home.png" x="0" y="0" width="610" height="610" preserveAspectRatio="none" />
                    </pattern>
                    
                    <linearGradient id="customGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="rgb(255, 254, 252)" />
                        <stop offset="100%" stop-color="rgb(130, 216, 231)" />
                    </linearGradient>
                </defs>
                
            <!-- Прямоугольник с градиентом -->
            <rect x="538" y="8" width="64" height="64" rx="32" fill="url(#customGradient)"></rect>

            <!-- SVG иконка на поверхности -->
            <g transform="translate(550, 20)"> 
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11.6667 5.56305C14.1182 4.14496 16.9643 3.33334 20 3.33334C29.2048 3.33334 36.6667 10.7953 36.6667 20C36.6667 29.2048 29.2048 36.6667 20 36.6667C10.7953 36.6667 3.33337 29.2048 3.33337 20C3.33337 16.9643 4.14499 14.1181 5.56308 11.6667" 
                        stroke="#274353" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M24.7141 31.7851C24.095 33.3327 23.3601 34.5604 22.5513 35.398C21.7424 36.2356 20.8755 36.6667 20 36.6667C19.1246 36.6667 18.2577 36.2356 17.4488 35.398C16.64 34.5604 15.9051 33.3327 15.286 31.7851C14.6669 30.2375 14.1759 28.4001 13.8408 26.378C13.5058 24.356 13.3334 22.1887 13.3334 20C13.3334 17.8113 13.5058 15.644 13.8408 13.6219C14.1759 11.5998 14.6669 9.76252 15.286 8.21488C15.9051 6.66723 16.64 5.43958 17.4488 4.602C18.2577 3.76442 19.1246 3.33332 20 3.33332C20.8755 3.33332 21.7424 3.76442 22.5513 4.60199C23.3601 5.43957 24.095 6.66723 24.7141 8.21488C25.3331 9.76252 25.8242 11.5998 26.1593 13.6219C26.4944 15.644 26.6667 17.8113 26.6667 20C26.6667 22.1887 26.4944 24.356 26.1593 26.378" 
                        stroke="#274353" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M3.33337 20H16.6667M36.6667 20H23.3334" stroke="#274353" stroke-width="1.5" stroke-linecap="round"/>
                </svg>            
            </g>
                
                <!-- Main rectangle -->
                <rect x="10" y="370" width="64" height="216" rx="32" fill="url(#customGradient)"/>
                
                <!-- First SVG (Environment) -->
                <g transform="translate(20, 388)">
                    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="22" cy="22" r="20.6186" stroke="#EBE9F4" stroke-width="1.23711"/>
                        <circle cx="22" cy="22" r="20.6186" stroke="#274353" stroke-width="1.23711"/>
                        <path d="M10 23.4815C10 32.963 17.0519 35.3333 20.5778 35.3333C22.3832 35.3333 24.9974 34.8575 27.3333 33.4796M30.9609 30C32.0028 28.3382 32.6667 26.2027 32.6667 23.4815C32.6667 17.4457 28.8871 13.135 25.4697 10.6636C23.925 9.54646 22 10.7733 22 12.6796V13.1111C22 15.0336 21.1917 18.5427 18.9458 20.0023C17.7991 20.7475 16.5607 19.6322 16.4213 18.2717L16.3069 17.1546C16.1739 15.856 14.8512 15.0676 13.8133 15.8594C12.9173 16.5429 12.0019 17.4731 11.2926 18.6667" stroke="#274353" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M16.6667 30.5926C16.6667 34.3852 19.9852 35.3333 21.6445 35.3333C23.0963 35.3333 26 34.3852 26 30.5926C26 29.1246 25.2143 28.1336 24.4539 27.5617C23.9233 27.1626 23.177 27.521 22.9946 28.1594C22.7567 28.9916 21.897 29.5146 21.4592 28.7679C21.0588 28.085 21.0588 27.0608 21.0588 26.4444C21.0588 25.5958 20.2052 25.0463 19.5186 25.5451C18.142 26.5454 16.6667 28.2419 16.6667 30.5926Z" stroke="#274353" stroke-width="1.5"/>
                    </svg>
                </g>

                <!-- Second SVG (Education) -->
                <g transform="translate(20, 456)">
                    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="22" cy="22" r="20.6186" stroke="#274353" stroke-width="1.23711"/>
                        <path d="M32.5304 27.3333H16.5304C15.2904 27.3333 14.6704 27.3333 14.1618 27.4696C12.7814 27.8395 11.7032 28.9177 11.3333 30.2981" stroke="#274353" stroke-width="1.5"/>
                        <path d="M16.6667 15.3333H27.3334" stroke="#274353" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M16.6667 20H23.3334" stroke="#274353" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M32 31.3333H16.6667" stroke="#274353" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M19.3333 35.3333C15.5621 35.3333 13.6765 35.3333 12.5049 34.1618C11.3333 32.9902 11.3333 31.1046 11.3333 27.3333V16.6667C11.3333 12.8954 11.3333 11.0098 12.5049 9.83824C13.6765 8.66667 15.5621 8.66667 19.3333 8.66667H24.6667C28.4379 8.66667 30.3235 8.66667 31.4951 9.83824C32.6667 11.0098 32.6667 12.8954 32.6667 16.6667M24.6667 35.3333C28.4379 35.3333 30.3235 35.3333 31.4951 34.1618C32.6667 32.9902 32.6667 31.1046 32.6667 27.3333V22" stroke="#274353" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </g>

                <!-- Third SVG (Arrow) -->
                <g transform="translate(20, 524)">
                    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="22" cy="22" r="20.6186" stroke="#274353" stroke-width="1.23711"/>
                        <path d="M14 30L30 14M30 14H18M30 14V26" stroke="#274353" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </g>

                <!-- Background pattern -->
                <path fill-rule="evenodd" clip-rule="evenodd" d="M0 80C0 35.8172 35.8172 0 80 0H490C512.091 0 530 17.9086 530 40C530 62.0914 547.909 80 570 80C592.091 80 610 97.9086 610 120V530C610 574.183 574.183 610 530 610H164C119.817 610 84 574.183 84 530V402C84 378.804 65.196 360 42 360C18.804 360 0 341.196 0 318V80Z" fill="url(#imgPattern)"/>
            </svg>  
        </div>
    </body>
</html>
